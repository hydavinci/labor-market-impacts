server {
    listen 80;
    listen 443 ssl;
    server_name market-impact.graymammoth.com;

    ssl_certificate /etc/nginx/ssl/flightradar.crt;
    ssl_certificate_key /etc/nginx/ssl/flightradar.key;

    root /home/Labor-Market-Impacts;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ =404;
    }
    location ~ /\. { deny all; }
    location ~ ^/(deploy|scripts|tests|artifacts)/ { deny all; }
    location ~* \.(md|bak|log)$ { deny all; }

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
}
